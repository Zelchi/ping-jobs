name: Publish job to jobs.zelchi.com

on:
  issues:
    types:
      - opened
      - edited

permissions:
  issues: write

concurrency:
  group: publish-job-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  publish:
    if: startsWith(github.event.issue.title, '[job]') && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest

    env:
      JOB_PAYLOAD: ${{ github.event.issue.body }}
      ISSUE_URL: ${{ github.event.issue.html_url }}
      API_URL: https://jobs.zelchi.com/messages

    steps:
      - name: Validate payload
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          import os
          import sys
          from urllib.parse import urlparse

          raw = os.environ.get("JOB_PAYLOAD", "")

          try:
              payload = json.loads(raw)
          except json.JSONDecodeError as exc:
              print(f"Invalid JSON: {exc}", file=sys.stderr)
              sys.exit(1)

          if not isinstance(payload, dict):
              print("Payload must be a JSON object.", file=sys.stderr)
              sys.exit(1)

          expected = {"title", "content", "link", "date"}
          extra = set(payload) - expected
          missing = expected - set(payload)

          if extra:
              print("Unexpected fields: " + ", ".join(sorted(extra)), file=sys.stderr)
              sys.exit(1)

          if missing:
              print("Missing fields: " + ", ".join(sorted(missing)), file=sys.stderr)
              sys.exit(1)

          limits = {
              "title": 256,
              "content": 4096,
              "link": 2048,
              "date": 1024,
          }

          for field, maximum in limits.items():
              value = payload[field]

              if not isinstance(value, str):
                  print(f"{field} must be a string.", file=sys.stderr)
                  sys.exit(1)

              if not value.strip():
                  print(f"{field} cannot be empty.", file=sys.stderr)
                  sys.exit(1)

              if len(value) > maximum:
                  print(f"{field} exceeds {maximum} characters.", file=sys.stderr)
                  sys.exit(1)

          parsed = urlparse(payload["link"])
          if parsed.scheme not in {"http", "https"} or not parsed.netloc:
              print("link must be a valid HTTP/HTTPS URL.", file=sys.stderr)
              sys.exit(1)

          with open("payload.json", "w", encoding="utf-8") as file:
              json.dump(payload, file, ensure_ascii=False, separators=(",", ":"))
          PY

      - name: Send job to API
        id: api
        shell: bash
        env:
          JOBS_API_TOKEN: ${{ secrets.JOBS_API_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${JOBS_API_TOKEN:-}" ]; then
            echo "JOBS_API_TOKEN is not configured." >&2
            exit 1
          fi

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          http_status="$(
            curl \
              --silent \
              --show-error \
              --output "$response_file" \
              --write-out "%{http_code}" \
              --request POST \
              --url "$API_URL" \
              --header "Authorization: Bearer $JOBS_API_TOKEN" \
              --header "Content-Type: application/json" \
              --data-binary @payload.json \
              --connect-timeout 10 \
              --max-time 30 \
              --retry 3 \
              --retry-delay 2 \
              --retry-all-errors
          )"

          case "$http_status" in
            202)
              result="accepted"
              echo "API accepted the job into its queue."
              ;;
            409)
              result="duplicate"
              echo "API rejected the job as a duplicate from the last 30 days."
              ;;
            *)
              echo "API returned HTTP $http_status." >&2
              cat "$response_file" >&2
              exit 1
              ;;
          esac

          echo "result=$result" >> "$GITHUB_OUTPUT"

      - name: Delete processed Issue
        id: delete_issue
        if: steps.api.outputs.result != ''
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ISSUE_DELETE_TOKEN }}
          ISSUE_NODE_ID: ${{ github.event.issue.node_id }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ] || [ -z "${ISSUE_NODE_ID:-}" ]; then
            exit 1
          fi

          gh api graphql \
            -f query='
              mutation($issueId: ID!) {
                deleteIssue(input: { issueId: $issueId }) {
                  repository {
                    nameWithOwner
                  }
                }
              }
            ' \
            -f issueId="$ISSUE_NODE_ID"

      - name: Report API failure
        if: failure() && steps.api.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh issue comment "$ISSUE_URL" --body \
            "❌ Não foi possível publicar esta vaga. Consulte a execução do GitHub Actions para ver o erro. A Issue permaneceu aberta. Depois de corrigir o problema, edite a Issue para disparar uma nova tentativa."

      - name: Report Issue deletion failure
        if: steps.api.outputs.result != '' && steps.delete_issue.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          API_RESULT: ${{ steps.api.outputs.result }}
        run: |
          set -euo pipefail

          if [ "$API_RESULT" = "duplicate" ]; then
            body="⚠️ Esta vaga não foi enfileirada porque a API encontrou uma vaga equivalente nos últimos 30 dias. A Issue não pôde ser apagada; corrija o Secret ISSUE_DELETE_TOKEN ou remova-a manualmente."
          else
            body="⚠️ A API aceitou a vaga na fila, mas esta Issue não pôde ser apagada. Ela pode já ser publicada no Discord; não reenvie a vaga antes de confirmar."
          fi

          gh issue comment "$ISSUE_URL" --body "$body"
