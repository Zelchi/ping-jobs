name: ping-work

services:
  pingbot:
    build:
      context: .
      dockerfile: dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    env_file:
      - .env
    environment:
      HTTP_ADDR: 0.0.0.0:8080
      DATABASE_PATH: /data/ping-work.sqlite
    volumes:
      - ping_work_data:/data
    ports:
      - "${HTTP_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  ping_work_data:
